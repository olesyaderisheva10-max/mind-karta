<html lang="ru">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Майнд-карта · Центр интегративной психологии</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;
    background:#f4f5fa;color:#1c1f2b;-webkit-font-smoothing:antialiased;
  }
  /* ---------- TOPBAR ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
    padding:14px 24px;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid #e6e8f0;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:260px}
  .logo{
    width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;color:#fff;
    background:linear-gradient(135deg,#6366f1,#a855f7 55%,#ec4899);
    box-shadow:0 8px 18px -8px rgba(99,102,241,.85);
  }
  .brand h1{font-size:15px;margin:0;font-weight:680;letter-spacing:-.01em}
  .brand p{margin:1px 0 0;font-size:11.5px;color:#8a90a4}
  .gp{display:flex;align-items:center;gap:10px}
  .gp-bar{width:180px;height:8px;border-radius:99px;background:#eceef6;overflow:hidden}
  .gp-fill{height:100%;width:0;border-radius:99px;transition:width .35s ease;
    background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899)}
  .gp-text{font-size:12px;font-weight:650;color:#5a6280;font-variant-numeric:tabular-nums}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .controls button{
    font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer;
    border:1px solid #dfe3ef;background:#fff;color:#4a5168;transition:.15s;
  }
  .controls button:hover{background:#f4f6fd;border-color:#c8cfe8}
  .controls button.danger{color:#dc2626;border-color:#f3d3d3}
  .controls button.danger:hover{background:#fef2f2}
  .switch{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#5a6280;cursor:pointer;user-select:none}
  .switch input{accent-color:#6366f1;cursor:pointer}

  /* ---------- BOARD ---------- */
  .board{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:18px;padding:24px;align-items:start;max-width:1900px;margin:0 auto;
  }
  .area{
    background:#fff;border-radius:16px;display:flex;flex-direction:column;
    box-shadow:0 1px 2px rgba(16,24,40,.05),0 12px 28px -18px rgba(16,24,40,.35);
    border:1px solid #edeff6;overflow:hidden;
  }
  .area-head{display:flex;align-items:flex-start;gap:11px;padding:16px 16px 10px}
  .area-icon{
    flex:0 0 36px;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
    font-size:17px;background:var(--c);color:#fff;box-shadow:0 6px 14px -7px var(--c);
  }
  .area-title-wrap{flex:1;min-width:0}
  .area-title{
    font-size:14.5px;font-weight:660;margin:0;line-height:1.3;outline:none;
    border-radius:7px;padding:2px 5px;margin-left:-5px;letter-spacing:-.01em;
  }
  .area-title:focus{background:#eef1ff;box-shadow:0 0 0 2px #c7d0ff}
  .area-meta{margin-top:5px;font-size:11.5px;font-weight:650;color:#8a90a4;font-variant-numeric:tabular-nums}
  .area-bar{height:4px;background:#eef0f6;margin:0 16px;border-radius:99px;overflow:hidden}
  .area-fill{height:100%;width:0;border-radius:99px;background:var(--c);transition:width .35s ease}
  .stages{padding:6px 16px 0}

  .stage{padding-bottom:6px}
  .stage-title{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#8a90a4;font-weight:750;
    margin:14px 0 7px;outline:none;border-radius:6px;padding:2px 5px;margin-left:-5px;
  }
  .stage-title:focus{background:#eef1ff;box-shadow:0 0 0 2px #c7d0ff}

  .tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
  .task{
    display:flex;gap:9px;align-items:flex-start;padding:6px 6px 6px 5px;border-radius:9px;
    transition:background .12s;
  }
  .task:hover{background:#f7f8fd}
  .cb{position:relative;flex:0 0 18px;width:18px;height:18px;margin-top:2px;cursor:pointer}
  .cb input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
  .cb .check{
    display:block;width:18px;height:18px;border-radius:6px;border:1.5px solid #cfd4e3;background:#fff;
    transition:.15s;position:relative;
  }
  .cb input:checked + .check{background:var(--c);border-color:var(--c)}
  .cb input:checked + .check::after{
    content:'';position:absolute;left:5.5px;top:1.5px;width:4.5px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
  }
  .cb input:focus-visible + .check{box-shadow:0 0 0 3px #dbe0ff}
  .task-text{
    flex:1;font-size:13.5px;line-height:1.45;outline:none;border-radius:6px;padding:2px 4px;
    word-break:break-word;transition:.12s;
  }
  .task-text:focus{background:#fff;box-shadow:0 0 0 2px #c7d0ff}
  .task.done .task-text{color:#a7adc0;text-decoration:line-through;text-decoration-thickness:1.5px}
  .del{
    flex:0 0 20px;width:20px;height:20px;border:none;background:none;border-radius:6px;cursor:pointer;
    color:#c3c8d8;font-size:15px;line-height:1;opacity:0;transition:.12s;padding:0;margin-top:1px;
  }
  .task:hover .del{opacity:1}
  .del:hover{background:#fee2e2;color:#dc2626}

  .add-task{
    font:inherit;font-size:12px;font-weight:600;color:#9aa0b4;background:none;border:none;cursor:pointer;
    padding:6px 6px;border-radius:7px;margin:2px 0 0 4px;transition:.12s;

  .add-task:hover{color:#4a5168;background:#f2f4fb}
  .add-stage{
    font:inherit;font-size:12.5px;font-weight:600;margin:4px 16px 16px;padding:9px;cursor:pointer;
    border-radius:10px;border:1px dashed #d7dbe8;background:transparent;color:#9aa0b4;transition:.15s;

/* ================= СОСТОЯНИЕ ================= */
const STORAGE_KEY = 'psycenter_map_v1';
const uid = () => Math.random().toString(36).slice(2, 9);

function buildState() {
  return RAW.map(([icon, color, title, stages]) => ({
    id: uid(), icon, color, title,
    stages: stages.map(([stTitle, tasks]) => ({
      id: uid(), title: stTitle,
      tasks: tasks.map(t => ({ id: uid(), text: t, done: false }))
    }))
  }));
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return buildState();
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed) || !parsed.length) return buildState();
    return parsed;
  } catch (e) {
    return buildState();
  }
}

let state = load();
const save = () => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render() {
  const hideDone = hideDoneCb.checked;
  board.innerHTML = state.map(area => renderArea(area, hideDone)).join('');
  updateGlobal();
}

function renderArea(area, hideDone) {
  const all = area.stages.flatMap(s => s.tasks);
  const done = all.filter(t => t.done).length;
  const pct = all.length ? Math.round(done / all.length * 100) : 0;
  const stagesHtml = area.stages.map(st => renderStage(area, st, hideDone)).join('');

  return `
  <section class="area" data-a="${area.id}" style="--c:${area.color}">
    <header class="area-head">
      <div class="area-icon">${area.icon}</div>
      <div class="area-title-wrap">
        <h2 class="area-title" contenteditable="true" spellcheck="false">${esc(area.title)}</h2>
        <div class="area-meta">${done} / ${all.length}</div>
      </div>
    </header>
    <div class="area-bar"><div class="area-fill" style="width:${pct}%"></div></div>
    <div class="stages">${stagesHtml}</div>
    <button class="add-stage" data-add-stage="${area.id}">+ этап</button>
  </section>`;
}

function renderStage(area, st, hideDone) {
  const visible = st.tasks.filter(t => !hideDone || !t.done);
  if (hideDone && visible.length === 0) return '';

  return `
  <div class="stage" data-a="${area.id}" data-s="${st.id}">
    <h3 class="stage-title" contenteditable="true" spellcheck="false">${esc(st.title)}</h3>
    <ul class="tasks">${visible.map(t => renderTask(area, st, t)).join('')}</ul>
    <button class="add-task" data-add-task="${area.id}|${st.id}">+ задача</button>
  </div>`;
}

function renderTask(area, st, t) {
  return `
  <li class="task ${t.done ? 'done' : ''}" data-a="${area.id}" data-s="${st.id}" data-t="${t.id}">
    <label class="cb"><input type="checkbox" ${t.done ? 'checked' : ''}><span class="check"></span></label>
    <span class="task-text" contenteditable="true" spellcheck="false">${esc(t.text)}</span>
    <button class="del" title="Удалить задачу">×</button>
  </li>`;
}

function updateGlobal() {
  const all = state.flatMap(a => a.stages.flatMap(s => s.tasks));
  const done = all.filter(t => t.done).length;
  const pct = all.length ? done / all.length * 100 : 0;
  document.getElementById('gpFill').style.width = pct + '%';
  document.getElementById('gpText').textContent = `${done} / ${all.length}`;
}

/* ================= ПОИСК ================= */
const findArea = id => state.find(a => a.id === id);
const findStage = (aId, sId) => { const a = findArea(aId); return a && a.stages.find(s => s.id === sId); };
const findTask = (aId, sId, tId) => { const s = findStage(aId, sId); return s && s.tasks.find(t => t.id === tId); };

/* ================= ДЕЙСТВИЯ ================= */
function addTask(aId, sId) {
  const st = findStage(aId, sId);
  if (!st) return;
  const t = { id: uid(), text: 'Новая задача', done: false };
  st.tasks.push(t);
  save(); render();
  focusEditable(`.task[data-t="${t.id}"] .task-text`);
}

function addStage(aId) {
  const area = findArea(aId);
  if (!area) return;
  const st = { id: uid(), title: 'Новый этап', tasks: [] };
  area.stages.push(st);
  save(); render();
  focusEditable(`.stage[data-s="${st.id}"] .stage-title`);
}

function focusEditable(selector) {
  const el = document.querySelector(selector);
  if (!el) return;
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

/* ================= СОБЫТИЯ ================= */
board.addEventListener('change', e => {
  if (!e.target.matches('input[type=checkbox]')) return;
  const li = e.target.closest('.task');
  const t = findTask(li.dataset.a, li.dataset.s, li.dataset.t);
  if (!t) return;
  t.done = e.target.checked;
  save(); render();
});

board.addEventListener('click', e => {
  const del = e.target.closest('.del');
  if (del) {
    const li = del.closest('.task');
    const st = findStage(li.dataset.a, li.dataset.s);
    if (st) {
      st.tasks = st.tasks.filter(t => t.id !== li.dataset.t);
      save(); render();
    }
    return;
  }

  const addT = e.target.closest('.add-task');
  if (addT) {
    const [aId, sId] = addT.dataset.addTask.split('|');
    addTask(aId, sId);
    return;
  }

  const addS = e.target.closest('.add-stage');
  if (addS) {
    addStage(addS.dataset.addStage);
    return;
  }
});

/* Сохранение текста — без перерисовки, чтобы не терять фокус */
board.addEventListener('focusout', e => {
  const el = e.target;
  if (!el.isContentEditable) return;
  const text = el.textContent.replace(/\s+/g, ' ').trim() || 'Без названия';

  if (el.classList.contains('task-text')) {
    const li = el.closest('.task');
    const t = findTask(li.dataset.a, li.dataset.s, li.dataset.t);
    if (t) t.text = text;
  } else if (el.classList.contains('stage-title')) {
    const st = findStage(el.closest('.stage').dataset.a, el.closest('.stage').dataset.s);
    if (st) st.title = text;
  } else if (el.classList.contains('area-title')) {
    const area = findArea(el.closest('.area').dataset.a);
    if (area) area.title = text;
  }
  save();
});

board.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.isContentEditable) {
    e.preventDefault();
    e.target.blur();
  }
});

hideDoneCb.addEventListener('change', render);

/* ================= ЭКСПОРТ / ИМПОРТ / СБРОС ================= */
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'psycenter-map-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (!Array.isArray(parsed) || !parsed.length) throw new Error('bad format');
      state = parsed;
      save(); render();
    } catch (err) {
      alert('Не удалось загрузить файл: неверный формат.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Сбросить все отметки и вернуть исходную карту?')) return;
  state = buildState();
  save(); render();
});

/* ================= СТАРТ ================= */
render();
</script>
</body>
</html>
